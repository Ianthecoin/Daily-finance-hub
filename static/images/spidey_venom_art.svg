<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="spideyGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#e62429" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="venomGlow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0072ce" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#7b2cbf" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="webLineRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e62429" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0072ce" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Deep Dark Background -->
  <rect width="1920" height="1080" fill="#07080c"/>
  <rect width="1920" height="1080" fill="url(#spideyGlow)"/>
  <rect width="1920" height="1080" fill="url(#venomGlow)"/>

  <!-- Spider Web Grid Background Overlay -->
  <g stroke="url(#webLineRed)" stroke-width="1.2" opacity="0.25">
    <path d="M 0,0 L 1920,1080 M 1920,0 L 0,1080 M 960,0 L 960,1080 M 0,540 L 1920,540"/>
    <ellipse cx="960" cy="540" rx="300" ry="200" fill="none"/>
    <ellipse cx="960" cy="540" rx="600" ry="400" fill="none"/>
    <ellipse cx="960" cy="540" rx="900" ry="600" fill="none"/>
    <ellipse cx="960" cy="540" rx="1200" ry="800" fill="none"/>
  </g>

  <!-- Left: Spider-Man Eye Lens Silhouette -->
  <g transform="translate(140, 180) scale(1.4)" opacity="0.35">
    <path d="M 50,120 Q 180,40 320,130 Q 260,300 50,120 Z" fill="url(#eyeGlow)" stroke="#e62429" stroke-width="12"/>
    <path d="M 65,125 Q 180,55 305,135 Q 250,285 65,125 Z" fill="#ffffff"/>
  </g>

  <!-- Right: Venom Aggressive Eye Lens Silhouette -->
  <g transform="translate(1250, 140) scale(1.5)" opacity="0.35">
    <path d="M 350,80 C 220,120 120,250 80,360 C 140,320 280,290 350,220 C 400,170 420,110 350,80 Z" fill="#ffffff" stroke="#0072ce" stroke-width="10"/>
    <!-- Venom Sharp Teeth Splatters -->
    <path d="M 120,380 L 140,350 L 160,390 L 180,340 L 210,400" stroke="#ffffff" stroke-width="6" fill="none"/>
  </g>

  <!-- Center Spider Symbol Shadow -->
  <g transform="translate(860, 420) scale(1.2)" opacity="0.15">
    <path d="M 100,0 C 70,30 30,20 0,60 C 40,80 70,80 100,140 C 130,80 160,80 200,60 C 170,20 130,30 100,0 Z" fill="#e62429"/>
    <path d="M 100,20 L 20,-40 M 100,40 L 0,0 M 100,60 L -20,60 M 100,80 L 0,120" stroke="#e62429" stroke-width="8"/>
    <path d="M 100,20 L 180,-40 M 100,40 L 200,0 M 100,60 L 220,60 M 100,80 L 200,120" stroke="#e62429" stroke-width="8"/>
  </g>
</svg>
